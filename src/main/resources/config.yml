# SlimyTreeTaps configuration

# Chance to obtain Amber with the Tree Scraper, in percent.
amber-chance: 16

# Resin harvesting chances for each Tree Tap, in percent.
resin-chance:
  standard: 12
  reinforced: 24
  diamond: 32

# Vanilla resin integration for Minecraft 1.21.4+.
# Pale Oak becomes the natural bridge between vanilla Resin and SlimyTreeTaps.
vanilla-resin:
  enabled: true

  # Number of vanilla Resin Clumps dropped when a Pale Oak log is successfully tapped.
  # Values are clamped to a valid Minecraft stack size (1-64).
  pale-oak-output: 1

  # Number of Resin Clumps produced by a Resin Extractor from Pale Oak.
  # Values are clamped to a valid Minecraft stack size (1-64).
  extractor-output: 1

  # Resin-equivalent cost of one Rubber in the Rubber Factory.
  # This applies to Resin Clumps, Resin Blocks, Resin Bricks and Resin Bricks blocks.
  # Bulk recipes preserve the same resin value and processing rate automatically.
  # Values are clamped to 1-64.
  rubber-recipe-clumps: 4
