name: Build SlimyTreeTaps

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slimytreetaps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Slimefun Legacy 4.1.39 API
        run: |
          mkdir -p libs
          curl -fL \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.39/Slimefun-Legacy4.1.39.jar \
            -o libs/Slimefun-Legacy4.1.39.jar
          mvn -B install:install-file \
            -Dfile=libs/Slimefun-Legacy4.1.39.jar \
            -DgroupId=com.github.slimefun \
            -DartifactId=Slimefun \
            -Dversion=4.1.39 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build and test
        run: mvn -B clean package

      - name: Verify Java 25 bytecode
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -name 'SF_SlimyTreeTaps-*.jar' -print -quit)"
          test -n "$JAR"
          MAJOR="$(javap -verbose -classpath "$JAR" io.github.thebusybiscuit.slimytreetaps.TreeTaps | awk '/major version:/ {print $3; exit}')"
          test "$MAJOR" = "69"
          jar tf "$JAR" >/dev/null

      - name: Upload raw JAR
        uses: actions/upload-artifact@v7
        with:
          path: target/SF_SlimyTreeTaps-*.jar
          if-no-files-found: error
          archive: false
