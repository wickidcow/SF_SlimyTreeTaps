name: Build SF_SlimyTreeTaps

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_VERSION: "1.0.3"
  OUTPUT_NAME: "SF_SlimyTreeTaps1.0.3.jar"
  MAIN_CLASS: "io.github.thebusybiscuit.slimytreetaps.TreeTaps"
  SLIMEFUN_LEGACY_VERSION: "4.1.48"
  PAPER_VERSION: "26.2.build.111-stable"

concurrency:
  group: sf-slimytreetaps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish SF_SlimyTreeTaps1.0.3.jar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Slimefun Legacy 4.1.48 locally
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir .deps
          LEGACY_JAR=".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar"
          test -s "$LEGACY_JAR"
          unzip -tqq "$LEGACY_JAR"
          mvn -B install:install-file -Dfile="$LEGACY_JAR" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true
      - name: Verify maintained metadata and restored behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.3</version>' pom.xml
          grep -Fq '<finalName>SF_SlimyTreeTaps${project.version}</finalName>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq 'GNU General Public License v3.0' README.md
          grep -Fq 'NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.' README.md
          grep -Fq 'COPPER_TREE_TAP' src/main/java/io/github/thebusybiscuit/slimytreetaps/TreeTaps.java
          grep -Fq 'RESIN_CLUMP' src/main/java/io/github/thebusybiscuit/slimytreetaps/TreeTaps.java
          test -s src/main/java/io/github/thebusybiscuit/slimytreetaps/LogCache.java
          test -s src/main/java/io/github/thebusybiscuit/slimytreetaps/ResinConversion.java
      - name: Build release JAR against Slimefun Legacy and Paper 26.2
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version="${PAPER_VERSION}"
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="target/${OUTPUT_NAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -tqq "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${ARTIFACT_VERSION}"
          javap -verbose -classpath "$JAR" "$MAIN_CLASS" | grep -Fq 'major version: 65'
          jar tf "$JAR" | grep -Fq 'io/github/thebusybiscuit/slimytreetaps/LogCache.class'
          jar tf "$JAR" | grep -Fq 'io/github/thebusybiscuit/slimytreetaps/ResinConversion.class'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then echo 'Slimefun core classes must not be bundled into the addon JAR.' >&2; exit 1; fi
          if jar tf "$JAR" | grep -Eqi '(^|/)net/guizhanss/guizhanlib|(^|/)guizhanlib'; then echo 'External Slimefun utility-library classes must not be bundled into the addon JAR.' >&2; exit 1; fi
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish immutable versioned release JAR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          EXPECTED="sha256:$(sha256sum "$JAR" | awk '{print $1}')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${OUTPUT_NAME}\") | .digest" | head -n 1 || true)"
            if [[ -n "$EXISTING" ]]; then
              if [[ "$EXISTING" != "$EXPECTED" ]]; then echo "Release $TAG already contains different bytes for $OUTPUT_NAME. Bump the addon version instead of replacing an immutable build." >&2; exit 1; fi
              echo "$OUTPUT_NAME already exists with the expected digest: $EXPECTED"
            else
              gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_SlimyTreeTaps $TAG" --notes "Restores Albion-tested Pale Oak and vanilla Resin integration, cached safe log stripping, hardened Magical Mirror handling, and adds the Copper Tree Tap for modern Minecraft. Built with Java 25 targeting Java 21 bytecode against Slimefun Legacy ${SLIMEFUN_LEGACY_VERSION} / Paper ${PAPER_VERSION}."
          fi
