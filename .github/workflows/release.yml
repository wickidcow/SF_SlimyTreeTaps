name: Release SlimyTreeTaps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: slimytreetaps-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Slimefun Legacy 4.1.39 API
        run: |
          mkdir -p libs
          curl -fL \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.39/Slimefun-Legacy4.1.39.jar \
            -o libs/Slimefun-Legacy4.1.39.jar
          mvn -B install:install-file \
            -Dfile=libs/Slimefun-Legacy4.1.39.jar \
            -DgroupId=com.github.slimefun \
            -DartifactId=Slimefun \
            -Dversion=4.1.39 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build release JAR
        id: build
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          mvn -B -Drevision="$RELEASE_VERSION" clean package
          JAR="target/SF_SlimyTreeTaps-${RELEASE_VERSION}.jar"
          test -f "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload raw release artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.jar }}
          if-no-files-found: error
          archive: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          RELEASE_JAR: ${{ steps.build.outputs.jar }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_JAR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_JAR" \
              --title "SF_SlimyTreeTaps $RELEASE_VERSION" \
              --generate-notes
          fi
